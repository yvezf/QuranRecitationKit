[package]
name = "qrk-node"
version = "0.3.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi6", "async"] }
napi-derive = "2.16"
qrk-core = { version = "0.3", path = "../../../core/qrk-core" }
qrk-onnx = { version = "0.3", path = "../../../core/qrk-onnx" }
serde_json = "1"
[build-dependencies]
napi-build = "2"
[workspace]

[patch.crates-io]
# Keep the tokenizer API while replacing its archived compile-time macro backend.
paste = { path = "../../../third-party/paste-compat" }
