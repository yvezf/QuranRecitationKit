[package]
name = "qrk-python"
version = "0.3.0"
edition = "2021"
license = "MIT"
[lib]
name = "_native"
crate-type = ["cdylib"]
[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"] }
qrk-core = { path = "../../core/qrk-core" }
qrk-onnx = { path = "../../core/qrk-onnx" }
serde_json = "1"
