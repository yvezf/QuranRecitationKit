[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"
[project]
name = "quranrecitationkit"
version = "0.2.1"
description = "Offline Quran recitation tracking, shared Rust engine"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]
[tool.maturin]
python-source = "python"
module-name = "quranrecitationkit._native"
include = [{path = "LICENSES/**", format = "wheel"}]
