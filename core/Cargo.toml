[workspace]
resolver = "2"
members = ["qrk-core", "qrk-onnx", "qrk-audio", "qrk-ffi", "qrk-cli"]
[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Yousef Alabadi"]
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"

[patch.crates-io]
# Keep the tokenizer API while replacing its archived compile-time macro backend.
paste = { path = "../third-party/paste-compat" }
