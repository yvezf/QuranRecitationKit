[package]
name = "qrk-onnx"
version.workspace = true
edition.workspace = true
license.workspace = true
[features]
default = ["dynamic"]
dynamic = ["ort/load-dynamic"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
[dependencies]
qrk-core = { version = "0.3", path = "../qrk-core" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
