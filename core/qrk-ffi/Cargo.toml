[package]
name = "qrk-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
[lib]
name = "qrk"
crate-type = ["cdylib", "staticlib", "rlib"]
[features]
default = ["dynamic"]
dynamic = ["qrk-onnx/dynamic"]
[dependencies]
qrk-core = { path = "../qrk-core" }
qrk-onnx = { path = "../qrk-onnx", default-features = false }
serde_json.workspace = true
[build-dependencies]
cbindgen = "0.29"
