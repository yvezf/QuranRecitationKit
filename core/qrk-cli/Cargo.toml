[package]
name = "qrk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
[[bin]]
name = "qrk"
path = "src/main.rs"
[dependencies]
qrk-core = { version = "0.3", path = "../qrk-core" }
qrk-onnx = { version = "0.3", path = "../qrk-onnx" }
qrk-audio = { version = "0.3", path = "../qrk-audio" }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
hound = "3.5"

base64 = "0.23"
